<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | CJC Church</title>
  <style>
    * { box-sizing: border-box; }
    body { color: var(--cjc-ink); background: var(--cjc-surface); }
    main { min-height: 68vh; display: grid; place-items: center; padding: 64px 20px; text-align: center; }
    h1 { margin: 0; font-size: clamp(44px, 7.2vw, 76px); line-height: 1.08; letter-spacing: -.01em; }
    p { margin: 20px auto 28px; max-width: 520px; color: var(--cjc-muted); font-size: 18px; line-height: 1.64; }
  </style>
</head>
<body>
  <main class="animate-on-scroll">
    <div>
      <h1>That page is not here.</h1>
      <p>Let's get you back to CJC Church.</p>
      <a class="cjc-button" href="/">Return Home</a>
    </div>
  </main>
  <script>
    if ('IntersectionObserver' in window) document.documentElement.classList.add('js-anim');
    const observer = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -80px 0px' }) : null;

    document.querySelectorAll('.animate-on-scroll').forEach(el => observer && observer.observe(el));
  </script>
</body>
</html>
