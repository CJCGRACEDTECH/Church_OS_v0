kind = "web"
previewPath = "/"
title = "CJC Church"
version = "1.0.0"
id = "artifacts/church-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25363

[services.development]
run = "pnpm -w run dev:replit"

[services.production]
build = [ "pnpm", "run", "build:replit" ]
publicDir = "artifacts/church-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25363"
BASE_PATH = "/"
API_INTERNAL_PORT = "8083"
API_INTERNAL_URL = "http://127.0.0.1:8080"
